# /etc/nginx/sites-available/mentoria  (ative com: ln -s ../sites-available/mentoria /etc/nginx/sites-enabled/)
# O HTTPS é adicionado pelo certbot:  sudo certbot --nginx -d mentoria.exemplo.org.br
server {
    listen 80;
    server_name mentoria.exemplo.org.br;

    client_max_body_size 25M;          # envio de TCCs, logos e documentos

    location /static/ {
        alias /srv/mentoria/static/;
        expires 7d;
    }

    # Arquivo da gravação das reuniões: limite maior só nesta rota (acompanhe o parâmetro
    # "Tamanho máximo do arquivo da gravação", padrão 100 MB, em Administração › Parâmetros de regras)
    location ~ ^/reunioes/[0-9]+/gravacao$ {
        client_max_body_size 100M;
        client_body_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Nginx recebe o arquivo inteiro (mesmo em conexão lenta) e só então repassa ao Gunicorn pela rede local:
        # o worker não fica preso no upload nem estoura o --timeout 180 do serviço.
        proxy_read_timeout 900s;
    }

    # Conteúdo dos cursos (apostila, vídeo e material das aulas): mesmo cuidado da gravação. Acompanhe o parâmetro
    # "Tamanho máximo do vídeo da aula" (padrão 100 MB, em Administração › Parâmetros de regras › Conteúdo dos cursos)
    location ~ ^/admin/cursos/[0-9]+/conteudo$ {
        client_max_body_size 100M;
        client_body_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;         # IP real para o limitador de tentativas (ATRAS_DE_PROXY=1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
